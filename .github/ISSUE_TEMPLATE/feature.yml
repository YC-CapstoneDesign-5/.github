name: 기능 요청 (Feat)
description: 새로운 기능 개발 또는 개선 작업
title: "[Feat] "
labels: ["feat"]
body:
  - type: textarea
    id: background
    attributes:
      label: 배경 및 목적
      description: 어떤 요구사항(필수기능 정의서 번호 등)에 의한 작업인지 적어주세요.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 작업 목록
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 어떤 상태가 되면 이 이슈를 닫을 수 있는지 적어주세요.
  - type: dropdown
    id: part
    attributes:
      label: 담당 파트
      multiple: true
      options: [Frontend, Backend, UI/UX, QA, Docs, PM]

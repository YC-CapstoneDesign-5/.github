<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="959" height="539" rx="16" fill="none" stroke="#e2e8f0"/>

  <text x="480" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">행정 구조대 · 한눈에 보기</text>
  <text x="480" y="64" text-anchor="middle" font-size="13" fill="#64748b">부서가 제출한 자료를 검증 → 계산 → 보험 대조 → 기관별 양식 생성까지 처리합니다</text>


  <!-- ① 입력 경로 -->
  <text x="132" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">① 입력 경로</text>
  <g font-size="13" fill="#0f172a">
    <rect x="32" y="114" width="200" height="56" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="132" y="138" text-anchor="middle" font-weight="600">부서 공통 제출 포털</text>
    <text x="132" y="157" text-anchor="middle" font-size="11" fill="#64748b">FN-09 · 약 60개 부서 직접 제출</text>
    <rect x="32" y="182" width="200" height="56" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="132" y="206" text-anchor="middle" font-weight="600">모바일 전자출석</text>
    <text x="132" y="225" text-anchor="middle" font-size="11" fill="#64748b">FN-12 · 담당자 대리 입력</text>
    <rect x="32" y="250" width="200" height="56" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="132" y="274" text-anchor="middle" font-weight="600">엑셀 취합 (보조)</text>
    <text x="132" y="293" text-anchor="middle" font-size="11" fill="#64748b">FN-02 · 포털이 어려운 부서</text>
    <rect x="32" y="318" width="200" height="56" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="132" y="342" text-anchor="middle" font-weight="600">스캔 출석부 OCR (보조)</text>
    <text x="132" y="361" text-anchor="middle" font-size="11" fill="#64748b">FN-06 · 엑셀과 1:1 대조</text>
  </g>

  <!-- ② 제출 워크플로 -->
  <text x="364" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#0891b2">② 제출 워크플로</text>
  <g font-size="13" fill="#0f172a">
    <rect x="264" y="114" width="200" height="56" rx="10" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="364" y="138" text-anchor="middle" font-weight="600">부서장 승인·공문 연계</text>
    <text x="364" y="157" text-anchor="middle" font-size="11" fill="#64748b">FN-10 · 반려 사유 필수 · 확정 후 잠금</text>
    <rect x="264" y="216" width="200" height="56" rx="10" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="364" y="240" text-anchor="middle" font-weight="600">전월 대비 변경 감지</text>
    <text x="364" y="259" text-anchor="middle" font-size="11" fill="#64748b">FN-11 · 계좌 변경 시 지급 잠금</text>
    <rect x="264" y="318" width="200" height="56" rx="10" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="364" y="342" text-anchor="middle" font-weight="600">독촉·마감 관리</text>
    <text x="364" y="361" text-anchor="middle" font-size="11" fill="#64748b">FN-15 · 24일 요청 → 29일 마감</text>
  </g>

  <!-- ③ 처리 엔진 -->
  <text x="596" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">③ 처리 엔진</text>
  <g font-size="13" fill="#0f172a">
    <rect x="496" y="114" width="200" height="56" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="596" y="138" text-anchor="middle" font-weight="600">검증 룰 엔진</text>
    <text x="596" y="157" text-anchor="middle" font-size="11" fill="#64748b">FN-05 · 누락·중복·금액 차이</text>
    <rect x="496" y="182" width="200" height="56" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="596" y="206" text-anchor="middle" font-weight="600">인건비 계산</text>
    <text x="596" y="225" text-anchor="middle" font-size="11" fill="#64748b">FN-03 · 서버 Decimal 계산</text>
    <rect x="496" y="250" width="200" height="56" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="596" y="274" text-anchor="middle" font-weight="600">중도 입·퇴사 정산</text>
    <text x="596" y="293" text-anchor="middle" font-size="11" fill="#64748b">FN-14 · 일할·주휴·미사용 연차</text>
    <rect x="496" y="318" width="200" height="56" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="596" y="342" text-anchor="middle" font-weight="600">4대보험 귀속 매칭</text>
    <text x="596" y="361" text-anchor="middle" font-size="11" fill="#64748b">FN-04 · 다차원 대조 · 환급 추적</text>
  </g>

  <!-- ④ 출력 -->
  <text x="828" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">④ 출력</text>
  <g font-size="13" fill="#0f172a">
    <rect x="728" y="114" width="200" height="56" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="828" y="138" text-anchor="middle" font-weight="600">기관별 제출 양식 Export</text>
    <text x="828" y="157" text-anchor="middle" font-size="11" fill="#64748b">FN-07 · EX-01~05 (5종)</text>
    <rect x="728" y="182" width="200" height="56" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="828" y="206" text-anchor="middle" font-weight="600">일모아·인사랑 일괄 등록</text>
    <text x="828" y="225" text-anchor="middle" font-size="11" fill="#64748b">FN-16 · 파일 + 수기 체크리스트</text>
    <rect x="728" y="250" width="200" height="56" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="828" y="274" text-anchor="middle" font-weight="600">확인서·청구서 서명</text>
    <text x="828" y="293" text-anchor="middle" font-size="11" fill="#64748b">FN-13 · PDF · 전자서명/스캔</text>
    <rect x="728" y="318" width="200" height="56" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="828" y="342" text-anchor="middle" font-weight="600">현황 대시보드·웹 알림</text>
    <text x="828" y="361" text-anchor="middle" font-size="11" fill="#64748b">FN-08 · 미처리 드릴다운</text>
  </g>

  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M236,244 L260,244"/>
    <path d="M468,244 L492,244"/>
    <path d="M700,244 L724,244"/>
  </g>

  <!-- 공통 기반 -->
  <g font-size="13" fill="#0f172a">
    <rect x="32" y="390" width="288" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="176" y="411" text-anchor="middle" font-weight="600">참여자 마스터 · FN-01</text>
    <text x="176" y="429" text-anchor="middle" font-size="11" fill="#64748b">부서 이동·재참여·퇴사 후에도 이력 추적</text>
    <rect x="336" y="390" width="288" height="50" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="480" y="411" text-anchor="middle" font-weight="600">담당자 검토·확정</text>
    <text x="480" y="429" text-anchor="middle" font-size="11" fill="#64748b">불확실하면 ‘확인 필요’ · 자동 확정 금지</text>
    <rect x="640" y="390" width="288" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="784" y="411" text-anchor="middle" font-weight="600">감사 로그 · NFR-10</text>
    <text x="784" y="429" text-anchor="middle" font-size="11" fill="#64748b">작업자·일시·전후 값·사유 · 수정·삭제 불가</text>
  </g>

  <!-- 보안 · 설계 원칙 -->
  <rect x="32" y="452" width="896" height="44" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="480" y="479" text-anchor="middle" font-size="13" fill="#0f172a"><tspan font-weight="700" fill="#334155">행정망(내부망) 단독 운영</tspan>  ·  주민번호·계좌 AES-256 암호화·마스킹 · 역할 기반 권한(5개 역할) · OCR 온프레미스 · 웹 알림</text>
  <text x="480" y="520" text-anchor="middle" font-size="11" fill="#94a3b8">개인정보 최소 노출 · 결정론적 계산 · 자동 확정 금지 · 원본 추적성 · 업무 상태 독립 · 확정 후 잠금</text>
</svg>
